<!DOCTYPE html>
<html>

<head>

    <title>BMI Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="card">

        <h1>Your BMI</h1>

        <div class="bmi" style="color: {{ color }};">
            {{ bmi }}
        </div>

        <div class="status" style="color: {{ color }};">
            {{ status }}
        </div>

        <div class="info">
            BMI tells whether your body weight is healthy according to your height.
        </div>

        <a href="/">
            Calculate Again
        </a>

    </div>

</body>

</html>
